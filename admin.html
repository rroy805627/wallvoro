<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WALLVORO Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070d;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:24px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:48px;height:48px;border-radius:50%}.brand b{letter-spacing:3px}.panel{background:#0b101b;border:1px solid #25314a;border-radius:18px;padding:22px;margin-bottom:18px}h1{margin:0 0 8px;font-size:28px}h2{font-size:20px;margin-top:0}.muted{color:#9aa7bd;font-size:14px;line-height:1.5}label{display:block;margin:15px 0 7px;font-size:13px;color:#b9c5d9}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #33415d;background:#080d16;color:#fff;font-size:15px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#17c8f5;color:#041019;font-weight:800;margin-top:15px;font-size:15px}.danger{background:#252d3d;color:#fff}.status{margin-top:14px;padding:12px;border-radius:10px;background:#101827;color:#a9b8cf;font-size:13px}.hide{display:none}.preview{width:100%;max-height:320px;object-fit:contain;border-radius:12px;margin-top:12px;background:#03050a}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><img src="logo.png"><b>WALLVORO ADMIN</b></div>
<div class="panel" id="loginPanel">
<h1>Admin Login</h1><p class="muted">Only your Supabase admin account should be used here.</p>
<label>Email</label><input id="email" type="email" autocomplete="email" placeholder="admin email">
<label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="password">
<button id="loginBtn">Login</button><div id="loginStatus" class="status">Not logged in.</div>
</div>
<div class="panel hide" id="uploadPanel">
<h2>Upload Wallpaper</h2>
<p class="muted">Choose an original/licensed wallpaper. Recommended: JPG/PNG/WebP, ideally under 6 MB for the simple upload flow.</p>
<label>Wallpaper image</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp">
<img id="preview" class="preview hide" alt="Preview">
<div class="row"><div><label>Title</label><input id="title" placeholder="e.g. Neon Mountain"></div><div><label>Category</label><select id="category"><option>Nature</option><option>Anime</option><option>Cars</option><option>Space</option><option>AI Art</option><option>Motivation</option></select></div></div>
<div class="row"><div><label>Device</label><select id="device"><option>Mobile</option><option>Desktop</option><option>Both</option></select></div><div><label>Badge</label><select id="badge"><option>4K</option><option>HD</option></select></div></div>
<button id="publishBtn">Publish Wallpaper</button><button id="logoutBtn" class="danger">Logout</button>
<div id="uploadStatus" class="status">Ready.</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://wkcfkyzwlvhgdkapihyt.supabase.co'
const SUPABASE_KEY='sb_publishable_dhP4Bx7ddHBqpbOuJ8dO7w_cgLUhuzC'
const ADMIN_EMAIL='rroy805627@gmail.com'
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function configured(){return !SUPABASE_URL.startsWith('PASTE_')&&!SUPABASE_KEY.startsWith('PASTE_')&&!ADMIN_EMAIL.startsWith('PASTE_')}
function status(msg,err=false){$('loginStatus').textContent=msg;$('loginStatus').style.color=err?'#ff8b8b':'#a9b8cf'}
function uploadStatus(msg,err=false){$('uploadStatus').textContent=msg;$('uploadStatus').style.color=err?'#ff8b8b':'#a9b8cf'}
async function refresh(){if(!configured()){status('First replace the 3 PASTE_ values in admin.html.',true);return}const {data:{session}}=await sb.auth.getSession();if(session&&session.user.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){$('loginPanel').classList.add('hide');$('uploadPanel').classList.remove('hide')}else{$('loginPanel').classList.remove('hide');$('uploadPanel').classList.add('hide')}}
$('loginBtn').onclick=async()=>{if(!configured()){status('Configure Supabase URL, publishable key and admin email first.',true);return}const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status(error.message,true);return}const {data:{user}}=await sb.auth.getUser();if(!user||user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await sb.auth.signOut();status('This account is not the configured admin account.',true);return}status('Logged in.');await refresh()};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();await refresh()};
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hide')};
$('publishBtn').onclick=async()=>{try{const {data:{user}}=await sb.auth.getUser();if(!user||user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){uploadStatus('Please login again.',true);return}const f=$('file').files[0],title=$('title').value.trim(),category=$('category').value,device=$('device').value,badge=$('badge').value;if(!f||!title){uploadStatus('Image and title are required.',true);return}if(f.size>6*1024*1024){uploadStatus('Image is over 6 MB. Use a smaller file for this first version.',true);return}uploadStatus('Uploading image...');const safe=f.name.toLowerCase().replace(/[^a-z0-9.]+/g,'-');const path=`wallpapers/${Date.now()}-${safe}`;const up=await sb.storage.from('wallpapers').upload(path,f,{contentType:f.type,cacheControl:'31536000',upsert:false});if(up.error)throw up.error;const pub=sb.storage.from('wallpapers').getPublicUrl(path);const ins=await sb.from('wallpapers').insert({title,category,device,badge,image_url:pub.data.publicUrl,storage_path:path});if(ins.error)throw ins.error;uploadStatus('✅ Published successfully.');$('title').value='';$('file').value='';$('preview').classList.add('hide')}catch(e){uploadStatus(e.message||'Upload failed.',true)}};
refresh();
</script>
</body></html>
